name: Update Developer Achievement Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "04_Assessment/Developer_Achievement_System/**"
      - ".github/workflows/update-developer-achievements.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: developer-achievement-dashboard
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out course repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan student GitHub evidence
        env:
          GH_SCANNER_TOKEN: ${{ secrets.GH_SCANNER_TOKEN }}
        run: python 04_Assessment/Developer_Achievement_System/scripts/scan.py

      - name: Publish dashboard data
        run: python 04_Assessment/Developer_Achievement_System/scripts/generate_site.py

      - name: Commit refreshed achievement data
        run: |
          git config user.name "Developer Achievement Bot"
          git config user.email "developer-achievement-bot@users.noreply.github.com"
          git add \
            04_Assessment/Developer_Achievement_System/data/achievements.json \
            docs/data.json \
            docs/rules.json \
            docs/catalog.json
          if git diff --cached --quiet; then
            echo "No achievement changes to commit."
          else
            git commit -m "Update developer achievement data"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
