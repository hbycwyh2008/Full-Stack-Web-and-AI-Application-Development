name: GitHub Team Launch Auto Checker

on:
  workflow_dispatch:
  issues:
    types: [opened, edited, assigned, unassigned, closed, reopened]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, edited, reopened, synchronize, closed]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  push:
    branches: ['**']
  page_build:

permissions:
  contents: read
  issues: write
  pull-requests: read
  pages: read

concurrency:
  group: team-launch-check-${{ github.repository }}
  cancel-in-progress: true

jobs:
  check-progress:
    runs-on: ubuntu-latest
    env:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - name: Check challenge evidence and update Mission Control
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repoFullName = `${owner}/${repo}`;
            const progressTitle = '🚀 GitHub Team Launch Progress';
            const projectEvidenceTitle = '📋 Project Evidence';
            const syncTitle = '🔄 Local Sync Check';
            const reflectionTitle = '🧠 Final Reflection';

            const featureConfig = {
              html: {
                branch: 'feature-html',
                issueTitle: 'Build HTML structure',
                file: 'index.html'
              },
              css: {
                branch: 'feature-css',
                issueTitle: 'Add page styling',
                file: 'style.css'
              },
              javascript: {
                branch: 'feature-javascript',
                issueTitle: 'Add JavaScript interaction',
                file: 'script.js'
              }
            };

            const normalize = value => (value || '').trim().toLowerCase().replace(/\s+/g, ' ');
            const mark = value => value ? '✅' : '⬜';
            const warn = value => value ? '✅' : '🟨';
            const meaningfulText = value => (value || '').trim().length >= 15;
            const badCommit = /^(update|stuff|final|changes?|fix|work|commit|test|done|misc|asdf|wip)$/i;
            const meaningfulCommitMessage = message => {
              const firstLine = (message || '').split('\n')[0].trim();
              return firstLine.length >= 12 && !badCommit.test(firstLine);
            };

            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repository.default_branch;
            const ownerLogin = repository.owner.login;
            const { data: defaultRef } = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${defaultBranch}`
            });
            const defaultHeadSha = defaultRef.object.sha;

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100
            });
            const branchNames = new Set(branches.map(branch => branch.name));

            let allIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              per_page: 100
            });
            const realIssues = allIssues.filter(item => !item.pull_request);
            const findIssueByTitle = title => realIssues.find(issue => normalize(issue.title) === normalize(title));

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'all',
              per_page: 100
            });
            const pullFor = branch => pulls.find(pr =>
              pr.head.ref === branch && pr.base.ref === defaultBranch
            );

            const issueFor = {};
            const prFor = {};
            for (const [role, config] of Object.entries(featureConfig)) {
              issueFor[role] = findIssueByTitle(config.issueTitle);
              prFor[role] = pullFor(config.branch);
            }

            const featureIssuesExist = Object.values(issueFor).every(Boolean);

            // Create the Project evidence mission automatically once the three feature Issues exist.
            let projectEvidenceIssue = findIssueByTitle(projectEvidenceTitle);
            if (featureIssuesExist && !projectEvidenceIssue) {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title: projectEvidenceTitle,
                body: `# Project Evidence\n\nCreate a GitHub Project for this team and add the three feature Issues.\n\nMake the Project public for automatic checking, then comment here with:\n\n\`PROJECT https://github.com/users/USERNAME/projects/NUMBER\`\n\nFor an organization Project, use:\n\n\`PROJECT https://github.com/orgs/ORG/projects/NUMBER\`\n\nAlso include links to all three feature Issues in the same comment.\n\nThe checker will verify the Project URL is reachable and that all three Issue links are present.`,
              });
              projectEvidenceIssue = created.data;
              core.info(`Created Project Evidence issue #${created.data.number}.`);
            }

            // Infer roles from the three PR authors. This also lets the checker prove that
            // collaborators pushed branches into the shared repository instead of using forks.
            const roleUsers = {
              html: prFor.html?.user?.login || ownerLogin,
              css: prFor.css?.user?.login || null,
              javascript: prFor.javascript?.user?.login || null,
            };

            const roleSeparationEvidence = Boolean(
              prFor.html && prFor.css && prFor.javascript &&
              roleUsers.html === ownerLogin &&
              roleUsers.css && roleUsers.javascript &&
              roleUsers.css !== ownerLogin &&
              roleUsers.javascript !== ownerLogin &&
              roleUsers.css !== roleUsers.javascript
            );

            const sameRepoAccessEvidence = Boolean(
              prFor.html?.head?.repo?.full_name === repoFullName &&
              prFor.css?.head?.repo?.full_name === repoFullName &&
              prFor.javascript?.head?.repo?.full_name === repoFullName
            );
            const teamAccessEvidence = roleSeparationEvidence && sameRepoAccessEvidence;

            const featureBranchEvidence = Object.values(featureConfig).every(config =>
              branchNames.has(config.branch) || Boolean(pullFor(config.branch))
            );

            // Exact role assignment on the three feature Issues.
            const assignedTo = (issue, login) => Boolean(
              issue && login && (issue.assignees || []).some(user => user.login === login)
            );
            const issueAssignmentEvidence = Boolean(
              assignedTo(issueFor.html, ownerLogin) &&
              assignedTo(issueFor.css, roleUsers.css) &&
              assignedTo(issueFor.javascript, roleUsers.javascript)
            );

            // Project evidence: default GITHUB_TOKEN cannot read GitHub Projects v2.
            // We therefore verify a public Project URL plus all three Issue links.
            // If a PROJECT_TOKEN secret with Projects read permission exists, a strict GraphQL
            // verification is attempted as an additional check.
            let projectUrl = '';
            let projectEvidence = false;
            let projectStrictEvidence = false;
            if (projectEvidenceIssue) {
              const projectComments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: projectEvidenceIssue.number,
                per_page: 100
              });
              const projectEvidenceText = [
                projectEvidenceIssue.body || '',
                ...projectComments.map(comment => comment.body || '')
              ].join('\n');
              const match = projectEvidenceText.match(/PROJECT\s+(https:\/\/github\.com\/(?:users|orgs)\/[^/\s]+\/projects\/\d+)/i);
              if (match) {
                projectUrl = match[1];
                const hasAllIssueLinks = Object.values(issueFor).every(issue =>
                  issue && (
                    projectEvidenceText.includes(issue.html_url) ||
                    new RegExp(`(?:^|\\s)#${issue.number}(?:\\s|$)`).test(projectEvidenceText)
                  )
                );
                let reachable = false;
                try {
                  const response = await fetch(projectUrl, {
                    redirect: 'follow',
                    headers: { 'User-Agent': 'github-team-launch-checker' }
                  });
                  reachable = response.ok;
                } catch (error) {
                  core.info(`Project public-page check failed: ${error.message}`);
                }
                projectEvidence = reachable && hasAllIssueLinks;

                const projectToken = process.env.PROJECT_TOKEN;
                if (projectToken) {
                  try {
                    const projectMatch = projectUrl.match(/github\.com\/(users|orgs)\/([^/]+)\/projects\/(\d+)/i);
                    if (projectMatch) {
                      const ownerType = projectMatch[1] === 'orgs' ? 'organization' : 'user';
                      const projectOwner = projectMatch[2];
                      const projectNumber = Number(projectMatch[3]);
                      const query = ownerType === 'organization'
                        ? `query($login:String!, $number:Int!) { organization(login:$login) { projectV2(number:$number) { items(first:100) { nodes { content { ... on Issue { number repository { nameWithOwner } } } } } } } }`
                        : `query($login:String!, $number:Int!) { user(login:$login) { projectV2(number:$number) { items(first:100) { nodes { content { ... on Issue { number repository { nameWithOwner } } } } } } } }`;
                      const response = await fetch('https://api.github.com/graphql', {
                        method: 'POST',
                        headers: {
                          'Authorization': `Bearer ${projectToken}`,
                          'Content-Type': 'application/json',
                          'User-Agent': 'github-team-launch-checker'
                        },
                        body: JSON.stringify({ query, variables: { login: projectOwner, number: projectNumber } })
                      });
                      const payload = await response.json();
                      const projectNode = ownerType === 'organization'
                        ? payload?.data?.organization?.projectV2
                        : payload?.data?.user?.projectV2;
                      const projectIssueNumbers = new Set(
                        (projectNode?.items?.nodes || [])
                          .map(node => node?.content)
                          .filter(content => content?.repository?.nameWithOwner === repoFullName)
                          .map(content => content.number)
                      );
                      projectStrictEvidence = Object.values(issueFor).every(issue => issue && projectIssueNumbers.has(issue.number));
                    }
                  } catch (error) {
                    core.warning(`Strict Project check failed: ${error.message}`);
                  }
                }
              }
            }

            // Inspect PR descriptions, expected files, commit messages, and whether work looks local.
            let prQualityEvidence = true;
            let fileScopeEvidence = true;
            let meaningfulCommitEvidence = true;
            let localCommitEvidence = true;
            const prCommits = {};

            for (const [role, config] of Object.entries(featureConfig)) {
              const pr = prFor[role];
              const issue = issueFor[role];
              if (!pr || !issue) {
                prQualityEvidence = false;
                fileScopeEvidence = false;
                meaningfulCommitEvidence = false;
                localCommitEvidence = false;
                continue;
              }

              const body = pr.body || '';
              const hasSections = /what changed/i.test(body) && /why/i.test(body) && /testing/i.test(body);
              const closesIssue = new RegExp(`\\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\\s+#${issue.number}\\b`, 'i').test(body);
              const titleGood = (pr.title || '').trim().length >= 12;
              if (!(body.trim().length >= 80 && hasSections && closesIssue && titleGood)) {
                prQualityEvidence = false;
              }

              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100
              });
              const names = new Set(files.map(file => file.filename));
              const otherSourceFiles = Object.values(featureConfig)
                .map(item => item.file)
                .filter(file => file !== config.file);
              const correctScope = names.has(config.file) && otherSourceFiles.every(file => !names.has(file));
              if (!correctScope) fileScopeEvidence = false;

              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100
              });
              prCommits[role] = commits;
              const hasMeaningfulCommit = commits.some(commit => meaningfulCommitMessage(commit.commit?.message));
              const hasLocalStyleCommit = commits.some(commit =>
                meaningfulCommitMessage(commit.commit?.message) &&
                commit.committer?.login !== 'web-flow' &&
                normalize(commit.commit?.committer?.name) !== 'github'
              );
              if (!hasMeaningfulCommit) meaningfulCommitEvidence = false;
              if (!hasLocalStyleCommit) localCommitEvidence = false;
            }

            // Review evidence on both collaborator PRs and a required feedback round on at least one.
            let ownerReviewEvidence = true;
            let feedbackCycleEvidence = false;
            for (const role of ['css', 'javascript']) {
              const pr = prFor[role];
              if (!pr) {
                ownerReviewEvidence = false;
                continue;
              }

              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100
              });
              const inlineComments = await github.paginate(github.rest.pulls.listReviewComments, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100
              });

              const substantiveReview = reviews.some(review =>
                review.user?.login === ownerLogin &&
                ['APPROVED', 'CHANGES_REQUESTED', 'COMMENTED'].includes(review.state) &&
                meaningfulText(review.body)
              ) || inlineComments.some(comment =>
                comment.user?.login === ownerLogin && meaningfulText(comment.body)
              );
              if (!substantiveReview) ownerReviewEvidence = false;

              const changesRequested = reviews
                .filter(review => review.user?.login === ownerLogin && review.state === 'CHANGES_REQUESTED' && review.submitted_at)
                .map(review => new Date(review.submitted_at).getTime());
              const commits = prCommits[role] || [];
              const followUpAfterRequest = changesRequested.some(requestTime =>
                commits.some(commit => new Date(commit.commit?.author?.date || commit.commit?.committer?.date || 0).getTime() > requestTime)
              );
              if (followUpAfterRequest) feedbackCycleEvidence = true;
            }

            const allPrEvidence = Object.values(prFor).every(Boolean);
            const mergedEvidence = Object.values(prFor).every(pr => Boolean(pr?.merged_at));
            const issuesClosedEvidence = Object.values(issueFor).every(issue => issue?.state === 'closed');

            // Create the local-sync proof issue after all PRs are merged.
            let syncIssue = findIssueByTitle(syncTitle);
            if (mergedEvidence && roleSeparationEvidence && !syncIssue) {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title: syncTitle,
                body: `# Local Sync Check\n\nAll three feature PRs are merged. Each team member must now run locally:\n\n\`git switch ${defaultBranch}\`\n\`git pull\`\n\`git rev-parse --short HEAD\`\n\nThen each person comments here using the exact format:\n\n\`SYNCED SHORT_SHA\`\n\nYour SHA must match the current remote \`${defaultBranch}\` head. The checker validates each comment by GitHub username and timestamp.\n\nCurrent remote head: \`${defaultHeadSha}\``,
              });
              syncIssue = created.data;
              core.info(`Created Local Sync Check issue #${created.data.number}.`);
            }

            const participants = roleSeparationEvidence
              ? [ownerLogin, roleUsers.css, roleUsers.javascript]
              : [];
            const latestMergeTime = mergedEvidence
              ? Math.max(...Object.values(prFor).map(pr => new Date(pr.merged_at).getTime()))
              : 0;
            let syncEvidence = false;
            if (syncIssue && participants.length === 3) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: syncIssue.number,
                per_page: 100
              });
              syncEvidence = participants.every(login =>
                comments.some(comment => {
                  if (comment.user?.login !== login) return false;
                  if (new Date(comment.created_at).getTime() < latestMergeTime) return false;
                  const match = (comment.body || '').trim().match(/^SYNCED\s+([0-9a-f]{7,40})\b/i);
                  if (!match) return false;
                  return defaultHeadSha.startsWith(match[1].toLowerCase());
                })
              );
            }

            // Validate the integrated source on main.
            const getText = async path => {
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path, ref: defaultBranch });
                if (Array.isArray(data) || !data.content) return '';
                return Buffer.from(data.content, data.encoding || 'base64').toString('utf8');
              } catch (error) {
                core.info(`Could not read ${path}: ${error.message}`);
                return '';
              }
            };
            const html = await getText('index.html');
            const css = await getText('style.css');
            const js = await getText('script.js');
            const htmlEvidence = html.length >= 250 &&
              !/under construction/i.test(html) &&
              /href=["']style\.css["']/i.test(html) &&
              /src=["']script\.js["']/i.test(html) &&
              /<(main|header|section|article)\b/i.test(html);
            const cssRuleCount = (css.match(/\{/g) || []).length;
            const cssEvidence = css.length >= 180 && cssRuleCount >= 3;
            const jsEvidence = js.length >= 120 &&
              !/TODO/i.test(js) &&
              /addEventListener\s*\(/.test(js) &&
              /(textContent|innerText|classList|style\.)/.test(js);
            const codeEvidence = htmlEvidence && cssEvidence && jsEvidence;

            // Pages must be configured and the public HTML/CSS/JS assets must actually respond.
            let pagesConfiguredEvidence = false;
            let liveSiteEvidence = false;
            let pagesUrl = '';
            try {
              const { data: pages } = await github.rest.repos.getPages({ owner, repo });
              pagesConfiguredEvidence = Boolean(pages?.html_url);
              pagesUrl = pages?.html_url || '';
              if (pagesUrl) {
                const urls = [
                  pagesUrl,
                  new URL('style.css', pagesUrl).href,
                  new URL('script.js', pagesUrl).href
                ];
                const responses = await Promise.all(urls.map(url => fetch(url, {
                  redirect: 'follow',
                  headers: { 'User-Agent': 'github-team-launch-checker' }
                })));
                if (responses.every(response => response.ok)) {
                  const [liveHtml, liveCss, liveJs] = await Promise.all(responses.map(response => response.text()));
                  liveSiteEvidence = /style\.css/i.test(liveHtml) &&
                    /script\.js/i.test(liveHtml) &&
                    liveCss.length >= 180 &&
                    /addEventListener\s*\(/.test(liveJs);
                }
              }
            } catch (error) {
              core.info(`GitHub Pages/live-site check not ready: ${error.message}`);
            }

            // Create a final reflection issue after the live site passes.
            let reflectionIssue = findIssueByTitle(reflectionTitle);
            if (liveSiteEvidence && participants.length === 3 && !reflectionIssue) {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title: reflectionTitle,
                body: `# Final Reflection\n\nEach team member posts one comment beginning with \`REFLECTION:\`.\n\nMinimum: 120 characters. Explain your role and use at least two of these concepts correctly: branch, commit, push, Pull Request, review, merge, local, remote.\n\nExample format:\n\n\`REFLECTION: I worked on ...\``,
              });
              reflectionIssue = created.data;
              core.info(`Created Final Reflection issue #${created.data.number}.`);
            }

            let reflectionEvidence = false;
            if (reflectionIssue && participants.length === 3) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: reflectionIssue.number,
                per_page: 100
              });
              const concepts = /(branch|commit|push|pull request|review|merge|local|remote)/gi;
              reflectionEvidence = participants.every(login =>
                comments.some(comment => {
                  if (comment.user?.login !== login) return false;
                  const body = (comment.body || '').trim();
                  if (!/^REFLECTION:/i.test(body) || body.length < 120) return false;
                  const found = new Set((body.match(concepts) || []).map(value => value.toLowerCase()));
                  return found.size >= 2;
                })
              );
            }

            const checkpoints = [
              ['Three correctly named feature Issues exist', featureIssuesExist],
              ['Project evidence is public/reachable and lists all three Issues', projectEvidence],
              ['All three feature branches have repository evidence', featureBranchEvidence],
              ['Three distinct roles pushed same-repository PRs (collaborator access proven)', teamAccessEvidence],
              ['Feature Issues are assigned to the correct role accounts', issueAssignmentEvidence],
              ['Each PR contains at least one local-style Git commit', localCommitEvidence],
              ['Each feature has a meaningful commit message', meaningfulCommitEvidence],
              ['All three PRs have meaningful titles/descriptions, testing, and Closes #Issue', prQualityEvidence],
              ['Each role changed its assigned source file without editing the other two role files', fileScopeEvidence],
              ['Owner left substantive review evidence on both collaborator PRs', ownerReviewEvidence],
              ['At least one collaborator responded to a Changes Requested review with a later commit', feedbackCycleEvidence],
              ['All three PRs are merged and all three linked Issues are closed', mergedEvidence && issuesClosedEvidence],
              ['All three participants posted a valid current-main SYNCED proof after merging', syncEvidence],
              ['Final main contains non-placeholder HTML, CSS, and JavaScript interaction', codeEvidence],
              ['GitHub Pages is configured and the live HTML/CSS/JS assets pass checks', pagesConfiguredEvidence && liveSiteEvidence],
              ['All three participants submitted an automatically validated reflection', reflectionEvidence],
            ];

            const passed = checkpoints.filter(([, value]) => value).length;
            const total = checkpoints.length;
            const percent = Math.round((passed / total) * 100);
            const complete = passed === total;

            let nextMission = 'Mission 2: create the three correctly named feature Issues.';
            if (featureIssuesExist && !projectEvidence) {
              nextMission = `Mission 2: open **${projectEvidenceTitle}** and submit a public Project URL plus links to all three feature Issues.`;
            } else if (featureIssuesExist && projectEvidence && !featureBranchEvidence) {
              nextMission = 'Missions 3–4: clone locally and create the three feature branches.';
            } else if (featureBranchEvidence && !allPrEvidence) {
              nextMission = 'Missions 5–7: develop locally, commit, push, and open all three PRs into main.';
            } else if (allPrEvidence && !teamAccessEvidence) {
              nextMission = 'Mission 7: make sure Owner/HTML, CSS collaborator, and JavaScript collaborator are three distinct accounts and all PR branches live in this shared repository, not forks.';
            } else if (allPrEvidence && !issueAssignmentEvidence) {
              nextMission = 'Mission 2 check: assign each feature Issue to the GitHub account responsible for that feature.';
            } else if (allPrEvidence && (!localCommitEvidence || !meaningfulCommitEvidence)) {
              nextMission = 'Mission 5: each feature PR needs a meaningful local Git commit; do not complete the feature only through GitHub web editing.';
            } else if (allPrEvidence && (!prQualityEvidence || !fileScopeEvidence)) {
              nextMission = 'Mission 7: fix PR title/body/Issue-closing syntax and make sure each role changed only its assigned source file.';
            } else if (allPrEvidence && !ownerReviewEvidence) {
              nextMission = 'Mission 8: Owner must leave substantive review feedback on both collaborator PRs.';
            } else if (ownerReviewEvidence && !feedbackCycleEvidence) {
              nextMission = 'Mission 8: Owner requests one real change on CSS or JavaScript; that collaborator pushes a follow-up commit to the same PR.';
            } else if (feedbackCycleEvidence && !(mergedEvidence && issuesClosedEvidence)) {
              nextMission = 'Mission 9: Owner merges approved PRs; verify the Closes #Issue links close all three feature Issues.';
            } else if (mergedEvidence && !syncEvidence) {
              nextMission = `Mission 10: open **${syncTitle}**, pull the current main locally, and have all three team members post valid SYNCED proofs.`;
            } else if (syncEvidence && !codeEvidence) {
              nextMission = 'Final integration check: remove starter placeholders and make sure HTML links CSS/JS, CSS has real styling, and JavaScript has a working event listener.';
            } else if (codeEvidence && !(pagesConfiguredEvidence && liveSiteEvidence)) {
              nextMission = 'Final Mission: configure GitHub Pages and wait for the public HTML/CSS/JS site to build successfully.';
            } else if (liveSiteEvidence && !reflectionEvidence) {
              nextMission = `Final Mission: open **${reflectionTitle}** and have all three team members submit the required REFLECTION comments.`;
            } else if (complete) {
              nextMission = '🏆 COMPLETE — all automated GitHub Team Launch checks passed.';
            }

            const strictProjectLine = process.env.PROJECT_TOKEN
              ? `${mark(projectStrictEvidence)} Strict Project-v2 membership check using PROJECT_TOKEN`
              : `${warn(projectEvidence)} Strict Project-v2 membership check not enabled (optional PROJECT_TOKEN)`;

            const body = `# 🚀 GitHub Team Launch Progress\n\nThis is the automatic Mission Control page. The checker reads repository history and GitHub artifacts; students do **not** need to learn GitHub Actions.\n\n## Score\n\n**${passed}/${total} checkpoints — ${percent}%**\n\n## Automated Checkpoints\n\n${checkpoints.map(([label, value]) => `${mark(value)} ${label}`).join('  \n')}  \n${strictProjectLine}\n\n## Team Roles Detected\n\n- Owner / HTML: **${roleUsers.html || 'not detected'}**\n- CSS collaborator: **${roleUsers.css || 'not detected'}**\n- JavaScript collaborator: **${roleUsers.javascript || 'not detected'}**\n\n## Next Mission\n\n**${nextMission}**\n\n## Live Evidence\n\n- Default branch: \`${defaultBranch}\`\n- Current main SHA: \`${defaultHeadSha}\`\n- Project: ${projectUrl || 'not submitted'}\n- GitHub Pages: ${pagesUrl || 'not configured'}\n\n## About the Project Check\n\nThe default GitHub Actions \`GITHUB_TOKEN\` cannot read Projects v2. The normal classroom checker therefore validates a **public Project URL plus all three feature-Issue links**. If the teacher provides a repository secret named \`PROJECT_TOKEN\` with Projects read permission, the checker also verifies that the three Issues are actually present in that Project.\n\n---\n\nLast event checked: \`${context.eventName}\`.\n`;

            // Refresh issue list because the checker may have created mission Issues during this run.
            allIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              per_page: 100
            });
            const progressIssue = allIssues.find(item =>
              !item.pull_request && normalize(item.title) === normalize(progressTitle)
            );

            if (progressIssue) {
              const desiredState = complete ? 'closed' : 'open';
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: progressIssue.number,
                body,
                state: desiredState,
                ...(complete ? { state_reason: 'completed' } : {})
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: progressTitle,
                body
              });
            }
